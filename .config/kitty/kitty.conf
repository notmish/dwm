font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 11.0

# Background (color is set in the theme section at the bottom)
background_opacity 0.85
dynamic_background_opacity yes

# Optional: remove ugly padding feel
window_padding_width 10

# Optional: smoother visuals
enable_audio_bell no

# cursor trail
cursor_trail 1


enable_image_protocol yes

# ---------------------------------------------------------------------------
# Theme: soft monochrome, Materia Dark inspired (matches dwm / dmenu)
# No pure #000 / #fff: lower glare, easier on the eyes in long sessions.
# ---------------------------------------------------------------------------
foreground              #c8c8c8
background              #212121

selection_foreground    #eeeeee
selection_background    #505050

cursor                  #d6d6d6
cursor_text_color       #212121
url_color               #9fb9d9

# window borders (only visible with kitty splits), same as dwm
active_border_color     #9e9e9e
inactive_border_color   #3a3a3a
bell_border_color       #cfcfcf

# tab bar (if you ever use kitty tabs)
tab_bar_background      #1a1a1a
active_tab_foreground   #eeeeee
active_tab_background   #424242
inactive_tab_foreground #9e9e9e
inactive_tab_background #2c2c2c

# ANSI colors: neutral grays, with muted (desaturated) hues so that
# git diffs, ls, errors etc. stay readable without being harsh.
# black
color0                  #424242
color8                  #6b6b6b
# red
color1                  #cc7b7b
color9                  #e09a9a
# green
color2                  #8fb98f
color10                 #a9cfa9
# yellow
color3                  #d1b87a
color11                 #e3cf9c
# blue
color4                  #7f9fc6
color12                 #9fb9d9
# magenta
color5                  #b392b8
color13                 #c8aecd
# cyan
color6                  #7fb5b5
color14                 #9fcccc
# white
color7                  #c8c8c8
color15                 #eeeeee
